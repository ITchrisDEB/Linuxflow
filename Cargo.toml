[workspace]
resolver = "3"
members = [
    "crates/linuxflow-core",
    "crates/linuxflow-audio",
    "crates/linuxflow-stt",
    "crates/linuxflow-models",
    "crates/linuxflow-platform",
    "crates/linuxflow-i18n",
    "crates/linuxflow-gtk",
    "apps/linuxflow",
    "apps/linuxflow-engine",
    "apps/linuxflow-overlay",
]
exclude = ["proto"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ITchrisDEB/Linuxflow"
rust-version = "1.92"
publish = false

# Versions checked on crates.io on 2026-10-24. The features are chosen by each crate.
# Minimal interface baseline: GTK 4.12 / libadwaita 1.4 (features v4_12 / v1_4, nothing above).
[workspace.dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
audioadapter-buffers = "=5.2.0"
clap = { version = "4.6.7", features = ["derive"] }
cpal = { version = "=0.18.2", default-features = false }
directories = "6.0.0"
evdev = "0.13.2"
fancy-regex = "0.20.0"
fastrand = "2.5.0"
futures-util = "0.3.34"
gdk4 = { version = "=0.11.5", default-features = false }
gettext-rs = "0.8.0"
gtk4 = { version = "=0.11.5", default-features = false }
gtk4-layer-shell = { version = "=0.8.1", default-features = false }
hound = "3.5.1"
ksni = "0.3.7"
libadwaita = { version = "=0.9.2", default-features = false }
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false }
rubato = { version = "=5.0.1", default-features = false }
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"
whisper-rs = { version = "=0.16.0", default-features = false }
ashpd = { version = "=0.13.13", default-features = false }
x11rb = "0.14.0"
wl-clipboard-rs = "0.9.4"
arboard = { version = "3.7.0", default-features = false }
zbus = { version = "6.1.0", default-features = false }

linuxflow-core = { path = "crates/linuxflow-core" }
linuxflow-audio = { path = "crates/linuxflow-audio" }
linuxflow-stt = { path = "crates/linuxflow-stt" }
linuxflow-models = { path = "crates/linuxflow-models" }
linuxflow-platform = { path = "crates/linuxflow-platform" }
linuxflow-i18n = { path = "crates/linuxflow-i18n" }
linuxflow-gtk = { path = "crates/linuxflow-gtk" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Distributed binaries: symbols stripped.
[profile.release]
strip = "symbols"
