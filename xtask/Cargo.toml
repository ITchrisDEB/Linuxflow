[package]
name = "xtask"
version = "0.3.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/ITchrisDEB/Linuxflow"
publish = false
description = "Development and distribution tools of LinuxFlow (replace shell scripts)"

# Separate workspace: these dependencies never enter the shipped graph (Cargo.lock,
# THIRD_PARTY_NOTICES.md, cargo deny of the main project).
[workspace]

[dependencies]
flate2 = "1"
lzma-rs = "0.3"
regex = "1"
ruzstd = "0.7"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
